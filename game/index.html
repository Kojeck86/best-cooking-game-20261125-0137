<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Dapur Kilat — a fast Indonesian cooking game: take orders, grab ingredients, serve before the timer runs out.">
<link rel="icon" href="data:,">
<title>Dapur Kilat — Lightning Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2118; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; image-rendering: auto; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Dapur Kilat: masak pesanan secepat mungkin — klik bahan di counter, susun di piring, sajikan sebelum waktu habis"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
